<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOLLAR STORE</title>
    <style>body{margin:0;background:#0b1012;color:#72e5b0;font:16px system-ui;min-height:100vh;display:grid;place-items:center}a{color:inherit}</style>
    <script>
      // Pages cannot rewrite SPA routes. Return through index.html, preserving
      // the full query and fragment (including authentication redirects).
      const base = '/Dollar-Store-/'
      if (window.location.pathname.startsWith(base) && window.location.pathname !== base) {
        const route = window.location.pathname.slice(base.length) + window.location.search + window.location.hash
        window.location.replace(base + '?__ds_route=' + encodeURIComponent(route))
      }
    </script>
  </head>
  <body><a href="/Dollar-Store-/">DOLLAR STORE</a></body>
</html>
